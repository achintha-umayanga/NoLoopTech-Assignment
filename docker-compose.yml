services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: taskmanager-api
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - DATABASE_URL=file:/app/data/tasks.db
      - CORS_ORIGIN=http://localhost:3000
    volumes:
      - api-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/tasks').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:4000
    container_name: taskmanager-web
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  api-data:
